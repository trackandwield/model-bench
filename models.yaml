# Models under test. Ids use LiteLLM's "provider/model" form, so swapping a
# model is a one-line change. Check the provider's docs for current ids.
models:
  - id: anthropic/claude-haiku-4-5
    label: Claude Haiku 4.5
  - id: openai/gpt-5-mini
    label: GPT-5 mini
  - id: gemini/gemini-3.8-flash
    label: Gemini 3.8 Flash
  - id: openrouter/meta-llama/llama-3.3-70b-instruct
    label: Llama 3.3 70B (open weights)
    # LiteLLM has no price for this one. Copy $ per million tokens from the
    # model's page on openrouter.ai, or cost shows as "unknown".
    price_per_mtok:
      input: null
      output: null

# Held constant across every model so the comparison is fair.
settings:
  temperature: 0.2
  # Reasoning models spend hidden "thinking" tokens from this budget too, so
  # leave headroom: a one-page battlecard can need 4k+ on some models.
  max_tokens: 4096

# Judges for the subjective metrics. Each output is scored by the first judge
# from a different provider than the model that wrote it, so no model grades
# its own family. Use strong models here; judge quality caps result quality.
judges:
  - anthropic/claude-sonnet-5-5
  - openai/gpt-5.6

judge_settings:
  temperature: 0
  max_tokens: 4096
