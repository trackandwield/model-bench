# Models under test. Ids use LiteLLM's "provider/model" form, so swapping a
# model is a one-line change. Check the provider's docs for current ids.
models:
  - id: anthropic/claude-haiku-4-5
    label: Claude Haiku 4.5
  - id: openai/gpt-5-mini
    label: GPT-5 mini
  - id: gemini/gemini-2.5-flash
    label: Gemini 2.5 Flash
  - id: openrouter/meta-llama/llama-3.3-70b-instruct
    label: Llama 3.3 70B (open weights)

# Held constant across every model so the comparison is fair.
settings:
  temperature: 0.2
  max_tokens: 1024
