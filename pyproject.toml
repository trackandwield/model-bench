[project]
name = "model-bench"
version = "0.1.0"
description = "Run the same marketing task across several LLMs, score the outputs against metrics locked in advance, and explain which model wins where, why and at what cost."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.70",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
bench = "bench.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]
