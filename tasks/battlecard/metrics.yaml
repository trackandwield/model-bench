# DRAFT: success metrics for the battlecard task.
# Written as a starting point; the PMM rewrites the criteria in her own words,
# then run `python -m bench lock battlecard` before any model runs.
task: battlecard
status: draft            # change to "reviewed" once the PMM has signed off
reviewed_by: null        # who signed off
version: 1

# type: check       = automatic rule, pass/fail; `check` names a rule in bench/checks.py
#       judge       = LLM judge scores 1-5 against the metric's rubric (one judge call per metric);
#                     show_checks passes an automatic check's flags to the judge to rule on
#       human       = scored by a person in the blind review screen
#       operational = cost or latency, measured, not judged
# weight: share of the overall score; weights must add up to 1.0
# pass: the bar an output must clear on this metric
metrics:
  - name: no_invented_facts
    description: Makes no claim, number or feature that isn't in the company profile.
    type: judge
    weight: 0.30
    pass: ">= 4"
    show_checks: [unsourced_numbers]
    rubric:
      5: Every claim traces to the profiles. Gaps are named as gaps ("pricing isn't public; ask what they were quoted").
      4: One small stretch that a rep wouldn't repeat as fact, such as soft wording ("teams often find").
      3: One claim a rep could repeat that isn't in the profiles, such as a calculated total stated as fact ("$28,800 a year") or a feature implied but not stated.
      2: Several unsupported claims, or one invented price, number or feature ("enterprise starts at $49/seat").
      1: Invents pricing, customers or capabilities throughout; the card would mislead a buyer.
  - name: pricing_matches_source
    description: Any price stated matches the profile exactly; if the profile has no price, none is given.
    type: check
    check: prices_in_source
    weight: 0.15
    pass: "true"
  - name: specific_differentiators
    description: Three differentiators, each tied to a concrete proof point rather than "better UX".
    type: judge
    weight: 0.20
    pass: ">= 4"
    rubric:
      5: Three differentiators, each specific to this competitor and backed by a fact from the profiles ("live in under a day vs weeks of setup").
      4: Three specific differentiators; one has a weak or missing proof point.
      3: Mixed. One or two are specific, the rest generic ("easier to use", "great support").
      2: Mostly generic claims that would fit any competitor.
      1: No real differentiators, or ones that contradict the profiles.
  - name: objection_handling
    description: Each objection handler answers the actual objection a buyer would raise.
    type: judge
    weight: 0.15
    pass: ">= 3"
    rubric:
      5: Names the objections a buyer of this competitor would really raise, and answers each with a fact or a question that moves the deal ("Free tier? Ask what SSO and audit logs cost them in year two.").
      4: Realistic objections with good answers; one answer is vague.
      3: Realistic objections, but answers are mostly assertion ("we're better value").
      2: Objections are generic or the answers dodge them.
      1: No objection handling, or answers that would hurt the deal.
  - name: rep_ready
    description: A sales rep could use it on a call today without rewriting it.
    type: human
    weight: 0.10
    pass: ">= 4"
  - name: required_sections
    description: Has overview, differentiators, pricing, objection handlers and landmines sections.
    type: check
    check: required_sections
    args:
      sections: [Overview, Differentiators, Pricing, Objection handlers, Landmines]
    weight: 0.05
    pass: "true"
  - name: one_page
    description: Fits on one page.
    type: check
    check: max_words
    args:
      limit: 450
    weight: 0.05
    pass: "<= 450 words"

# Automatic checks reported for every output but not part of the weighted
# score. They flag things for the judge and for the "why" analysis.
diagnostics:
  - name: unsourced_numbers   # numbers in the card that aren't in the profiles
  - name: banned_terms
    args:
      terms: [revolutionary, game-changer, world-class, cutting-edge, seamless, best-in-class, synergy]
  - name: reading_grade       # Flesch-Kincaid grade level
    args:
      max_grade: 12

# Reported alongside quality, not part of the weighted score.
operational:
  - name: cost_per_output
  - name: latency
